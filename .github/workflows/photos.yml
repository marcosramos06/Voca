name: Fetch photos
on:
  push:
    branches: [picture-words]
    paths: [public/lang/pictures.js, scripts/fetch-photos.mjs, .github/workflows/photos.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download photos
        run: node scripts/fetch-photos.mjs
      - name: Save photos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/photos
          git diff --cached --quiet || git commit -m "Add Picture Words photos"
          git push
